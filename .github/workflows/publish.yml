name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv lock
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/eisyfit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check PyPI dependency availability
        shell: bash
        run: |
          set -euo pipefail
          for package in eisyfit-bayes-drt2 eisyfit-hybrid-drt eisyfit-galvani eisyfit-wepy; do
            if ! curl --fail --silent --show-error "https://pypi.org/pypi/${package}/json" >/dev/null; then
              echo "${package} is not published on PyPI. Publish a compatible distribution before releasing eisyfit."
              exit 1
            fi
          done
      - run: uv build
      - name: Check built distributions
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/eisyfit-*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          required = {
              "main.py",
              "eis_gui.py",
              "eis_model.py",
              "eis_project.py",
              "eis_services.py",
              "ml/__init__.py",
              "ml/runtime_inference.py",
            }
          missing = required - names
          assert not missing, f"Missing from wheel: {sorted(missing)}"
          assert any(name.endswith("entry_points.txt") for name in names)
          PY
      - name: Clean-install wheel check
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/eisyfit-clean
          /tmp/eisyfit-clean/bin/python -m pip install --upgrade pip
          /tmp/eisyfit-clean/bin/python -m pip install dist/eisyfit-*.whl
          /tmp/eisyfit-clean/bin/python -c "import importlib.metadata, main; assert importlib.metadata.version('eisyfit') == '0.1.3'; print('eisyfit clean install succeeded')"
      - run: uv publish
