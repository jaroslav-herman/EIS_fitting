name: Publish eisyfit to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: eisyfit-test-dist
          path: dist/*

  publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/eisyfit
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eisyfit-test-dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  install-check:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install from TestPyPI
        run: python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple eisyfit==0.1.4
      - name: Check installed application
        run: python -c "import importlib.metadata, main; assert importlib.metadata.version('eisyfit') == '0.1.4'; print('eisyfit imports successfully')"
