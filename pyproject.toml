[project]
name = "eisyfit"
version = "0.1.4"
description = "Interactive desktop application for exploring, cleaning, and fitting BioLogic electrochemical impedance spectra."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jaroslav Herman" },
]
keywords = ["electrochemistry", "impedance spectroscopy", "EIS", "BioLogic", "equivalent circuit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.14"
dependencies = [
    "eisyfit-bayes-drt2>=0.2",
    "eisyfit-hybrid-drt>=0.1",
    "impedance>=1.7.1",
    "matplotlib>=3.11.1",
    "natsort>=8.4.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "scipy>=1.18.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.5.0",
    "pygad>=3.6.0",
    "pyswarms>=1.3",
    "eisyfit-wepy>=0.1.2",
]

[project.urls]
Homepage = "https://github.com/jaroslav-herman/EIS_fitting"
Repository = "https://github.com/jaroslav-herman/EIS_fitting"
Issues = "https://github.com/jaroslav-herman/EIS_fitting/issues"

[project.scripts]
eisyfit = "main:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "circuit_structure",
    "eis_gui",
    "eis_model",
    "eis_project",
    "eis_services",
    "explorer_filter",
    "extract_relaxis",
    "main",
    "plot_export",
    "spectrum_simulator",
]

[tool.setuptools.packages.find]
include = ["ml*"]

[tool.setuptools.package-data]
"*" = ["*.ico", "*.png", "*.svg"]
